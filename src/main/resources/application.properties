spring.application.name=burger-express-api
server.port=8080

# Banco H2 em memoria (conveniencia para o prototipo academico)
spring.datasource.url=jdbc:h2:mem:burgerexpress;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console H2 para inspecao durante a demonstracao: http://localhost:8080/h2-console
spring.h2.console.enabled=true
